<!doctype html>
<!-- tab OS: a workspace for running agents and companies of agents. One page, no build step,
     no external scripts; served at / by the company server and talks to its /api -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tab OS</title>
<meta name="description" content="Run your agents and your company of agents: work, approvals, spending and receipts in one place.">
<meta name="theme-color" content="#05080c">
<link rel="manifest" href="/os.webmanifest">
<link rel="icon" type="image/png" href="/os-favicon.png?v=__ASSET_V__">
<link rel="apple-touch-icon" href="/os-icon-192.png?v=__ASSET_V__">
<style>
  @font-face { font-family:"Inter"; src:url(/inter.woff2) format("woff2"); font-weight:100 900; font-display:swap; }
  @font-face { font-family:"Geist Mono"; src:url(/geist-mono.woff2) format("woff2"); font-weight:100 900; font-display:swap; }
  @font-face { font-family:"Instrument Serif"; src:url(/instrument-serif-italic.woff2) format("woff2"); font-style:italic; font-weight:400; font-display:swap; }
  /* the home page's night: near black, white type, a pale blue accent, white pill buttons */
  :root {
    --bg:#05080c; --surface:#080c13; --surface2:#0b111a; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
    --fg:#f2f4f7; --fg2:#8a94a6; --dim:#5b6473;
    --accent:#9cc3ff; --accent2:#bcd6ff; --accent-soft:rgba(156,195,255,.1); --accent-fg:#05080c;
    --primary:#ffffff; --primary-fg:#05080c; --primary-hover:#e6eaf0;
    --ok:#7fd8a6; --ok-soft:rgba(127,216,166,.1); --warn:#f2c47e; --warn-soft:rgba(242,196,126,.1); --bad:#ff8fa0; --bad-soft:rgba(255,143,160,.1); --idle-soft:rgba(255,255,255,.05);
    --shadow:none; --shadow-lg:0 40px 120px -40px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.04); --scrim:rgba(1,3,8,.62); --logo:none;
    --sans:Inter,-apple-system,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
    --r:14px; color-scheme:dark;
  }
  /* daylight, for whoever asks for it in Settings: the same blue, darker so it reads on white */
  :root[data-theme="light"] {
    --bg:#f4f6f9; --surface:#ffffff; --surface2:#f8fafc; --line:#e5e8ee; --line2:#d3d8e1;
    --fg:#05080c; --fg2:#4d5768; --dim:#7b8494;
    --accent:#2563d9; --accent2:#1d4fb5; --accent-soft:#e8effc; --accent-fg:#ffffff;
    --primary:#05080c; --primary-fg:#ffffff; --primary-hover:#1c2533;
    --ok:#15924a; --ok-soft:#e7f6ed; --warn:#b86400; --warn-soft:#fdf2e1; --bad:#d4204b; --bad-soft:#fdebf0; --idle-soft:#eef1f5;
    --shadow:0 1px 2px rgba(5,8,12,.04); --shadow-lg:0 24px 60px -12px rgba(5,8,12,.25), 0 2px 6px rgba(5,8,12,.06); --scrim:rgba(5,8,12,.36); --logo:invert(1);
    color-scheme:light;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font:14px/1.45 var(--sans); -webkit-font-smoothing:antialiased; }
  /* the home page's sky behind everything: a few faint stars and a blue haze at the top */
  body::before { content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55), transparent 60%), radial-gradient(1px 1px at 27% 72%, rgba(255,255,255,.4), transparent 60%), radial-gradient(1.5px 1.5px at 41% 33%, rgba(255,255,255,.5), transparent 60%), radial-gradient(1px 1px at 58% 84%, rgba(255,255,255,.35), transparent 60%), radial-gradient(1px 1px at 66% 12%, rgba(255,255,255,.5), transparent 60%), radial-gradient(1.5px 1.5px at 79% 47%, rgba(255,255,255,.4), transparent 60%), radial-gradient(1px 1px at 88% 79%, rgba(255,255,255,.45), transparent 60%), radial-gradient(1px 1px at 94% 22%, rgba(255,255,255,.35), transparent 60%), radial-gradient(1px 1px at 6% 91%, rgba(255,255,255,.35), transparent 60%), radial-gradient(1px 1px at 50% 55%, rgba(255,255,255,.25), transparent 60%),
      radial-gradient(70% 50% at 60% 0%, rgba(40,72,130,.22), transparent 70%); }
  :root[data-theme="light"] body::before { display:none; }
  h1 em, h2 em { font-family:var(--serif); font-style:italic; font-weight:400; letter-spacing:-.01em; font-size:1.12em; line-height:.9; }
  .eyebrow { font:500 10.5px var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--fg2); }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  button { font:inherit; color:inherit; cursor:pointer; }
  [hidden] { display:none !important; }
  .mono { font-family:var(--mono); font-size:12.5px; }
  .dim { color:var(--dim); } .fg2 { color:var(--fg2); } .ok { color:var(--ok); } .bad { color:var(--bad); }
  svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  /* the picture icons are Higgsfield line drawings used as masks, so they take the text color like the home page's glyphs */
  .i.pic { width:20px; height:20px; display:inline-block; flex:none; background:currentColor; -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat; }

  /* -- buttons and fields -- */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; height:38px; padding:0 16px; border-radius:999px; border:1px solid var(--line2); background:transparent; font-weight:500; font-size:13.5px; white-space:nowrap; transition:background .2s, border-color .2s; }
  .btn:hover { border-color:var(--dim); }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:var(--primary-fg); } .btn.primary:hover { background:var(--primary-hover); border-color:var(--primary-hover); }
  .btn.danger { color:var(--bad); }
  .btn.sm { height:30px; padding:0 12px; font-size:12.5px; }
  .btn:disabled { opacity:.55; cursor:default; }
  .link { background:none; border:0; padding:0; color:var(--accent); font-weight:500; display:inline-flex; gap:5px; align-items:center; font-size:13px; }
  .link svg.i { width:15px; height:15px; }
  .icon-btn { width:38px; height:38px; display:grid; place-items:center; border-radius:10px; border:0; background:none; color:var(--fg2); position:relative; }
  .icon-btn:hover { background:var(--idle-soft); color:var(--fg); }
  label.f { display:block; font-size:12.5px; font-weight:500; color:var(--fg2); margin:14px 0 6px; }
  input, textarea, select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line2); background:var(--surface); color:var(--fg); font:inherit; font-size:14px; }
  input:focus, textarea:focus, select:focus { outline:3px solid var(--accent-soft); border-color:var(--accent); }
  textarea { min-height:90px; resize:vertical; }
  .err { color:var(--bad); font-size:13px; min-height:1.2em; margin-top:10px; }
  .hint { font-size:12.5px; color:var(--dim); margin-top:6px; }

  /* -- shell -- */
  .shell { display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh; }
  .side { border-right:1px solid var(--line); background:color-mix(in srgb, var(--bg) 70%, transparent); }
  .side-in { position:sticky; top:0; height:100vh; height:100dvh; display:flex; flex-direction:column; gap:6px; padding:18px 14px 14px; overflow-y:auto; }
  .brand { display:flex; align-items:center; gap:8px; padding:4px 10px 14px; }
  .brand { gap:10px; } .brand img { height:22px; width:auto; display:block; filter:var(--logo); }
  .brand span { font:500 10.5px var(--mono); letter-spacing:.22em; color:var(--fg2); padding-top:3px; }
  .switcher { position:relative; margin-bottom:10px; }
  .switcher > button { width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); text-align:left; }
  .switcher > button:hover { border-color:var(--line2); }
  .switcher .nm { flex:1; min-width:0; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .menu { position:absolute; z-index:30; left:0; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-lg); padding:6px; }
  .menu button { width:100%; display:flex; align-items:center; gap:10px; padding:9px 10px; border:0; background:none; border-radius:8px; text-align:left; }
  .menu button:hover { background:var(--idle-soft); }
  .menu hr { border:0; border-top:1px solid var(--line); margin:6px 0; }
  nav.apps { display:grid; gap:2px; }
  nav.apps button { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; border:0; background:none; color:var(--fg2); font-size:14px; text-align:left; }
  nav.apps button:hover { background:var(--idle-soft); color:var(--fg); }
  nav.apps button[aria-current="page"] { background:var(--accent-soft); color:var(--accent); font-weight:500; }
  nav.apps .badge { margin-left:auto; }
  .badge { min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--accent); color:var(--accent-fg); font-size:11.5px; font-weight:600; display:inline-grid; place-items:center; }
  .side .spacer { flex:1; }
  .me { display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px; border:0; background:none; width:100%; text-align:left; position:relative; }
  .me:hover { background:var(--idle-soft); }
  .initials { width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-fg); display:grid; place-items:center; font-weight:600; font-size:13px; flex:none; }
  .me .em { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }

  .top { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:14px clamp(16px,3vw,32px); background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .crumbs { color:var(--dim); font-size:13.5px; display:flex; gap:10px; align-items:center; min-width:0; }
  .crumbs b { color:var(--fg); font-weight:500; }
  .top .grow { flex:1; }
  .search { display:flex; align-items:center; gap:10px; width:min(370px, 34vw); height:40px; padding:0 8px 0 14px; border:1px solid var(--line2); border-radius:12px; background:var(--surface); color:var(--dim); text-align:left; }
  .search span { flex:1; }
  kbd { font:11px var(--mono); border:1px solid var(--line2); border-radius:6px; padding:2px 6px; color:var(--fg2); background:var(--surface2); }
  .dot { position:absolute; top:6px; right:6px; min-width:16px; height:16px; padding:0 4px; border-radius:999px; background:var(--accent); color:var(--accent-fg); font-size:10px; font-weight:700; display:grid; place-items:center; }
  main.app { padding:clamp(20px,3vw,32px); padding-bottom:96px; max-width:1680px; margin:0 auto; }
  h1 { font-size:clamp(28px,3.2vw,40px); letter-spacing:-.04em; line-height:1.08; margin:4px 0 6px; font-weight:500; }
  .lede { color:var(--fg2); font-size:15.5px; margin:0 0 24px; max-width:70ch; }
  .head-row { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .head-row .lede { margin:0; }

  /* -- cards -- */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); min-width:0; }
  .card > header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 22px 6px; }
  .card > header h2 { font-size:17px; margin:0; font-weight:500; letter-spacing:-.02em; }
  .card .body { padding:8px 22px 20px; }
  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:18px; }
  .kpi { display:flex; align-items:center; gap:16px; padding:20px; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); }
  .kpi:hover { border-color:var(--line2); }
  .kpi .ic { width:46px; height:46px; border-radius:12px; display:grid; place-items:center; flex:none; }
  .kpi .ic .i { width:24px; height:24px; }
  .wip .ic .i { width:22px; height:22px; }
  .kpi .t { flex:1; min-width:0; }
  .kpi .lbl { font:500 10.5px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--fg2); margin-bottom:4px; }
  .kpi .val { font-size:26px; font-weight:500; letter-spacing:-.02em; display:flex; align-items:baseline; gap:2px 10px; flex-wrap:wrap; }
  .kpi .sub { white-space:nowrap; }
  .kpi .sub { font-size:12.5px; color:var(--dim); font-weight:500; letter-spacing:0; }
  .kpi > svg.i { color:var(--dim); }
  .tone-ok { background:var(--ok-soft); color:var(--ok); } .tone-acc { background:var(--accent-soft); color:var(--accent); }
  .tone-blue { background:var(--accent-soft); color:var(--accent); } .tone-warn { background:var(--warn-soft); color:var(--warn); }
  .grid-main { display:grid; grid-template-columns:minmax(0,1.85fr) minmax(0,1fr); gap:16px; margin-bottom:16px; align-items:stretch; }

  table.t { width:100%; border-collapse:collapse; }
  table.t th { text-align:left; font:500 10.5px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--dim); padding:10px 12px 10px 0; border-bottom:1px solid var(--line); }
  table.t td { padding:13px 12px 13px 0; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.t tr:last-child td { border-bottom:0; }
  table.t tr.click { cursor:pointer; } table.t tr.click:hover td { background:var(--surface2); }
  .who { display:flex; align-items:center; gap:12px; font-weight:600; }
  .av { width:34px; height:34px; flex:none; object-fit:contain; }
  .av.lg { width:64px; height:64px; } .av.md { width:44px; height:44px; }
  .wrap-any { overflow-wrap:anywhere; word-break:break-word; }
  .ell { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:0; }

  .st { display:inline-flex; align-items:center; gap:7px; padding:4px 10px; border-radius:8px; font-size:12.5px; font-weight:500; white-space:nowrap; }
  .st::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .st.running, .st.done, .st.active, .st.approved { background:var(--ok-soft); color:var(--ok); }
  .st.approval, .st.review, .st.pending, .st.paused { background:var(--warn-soft); color:var(--warn); }
  .st.failed, .st.blocked, .st.rejected { background:var(--bad-soft); color:var(--bad); }
  .st.in_progress, .st.open { background:var(--accent-soft); color:var(--accent); }
  .st.idle, .st.retired, .st.cancelled { background:var(--idle-soft); color:var(--fg2); }
  .st.running::before { animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.3; } }

  .appr { display:grid; grid-template-columns:52px minmax(0,1fr); gap:14px; padding:16px 0; border-bottom:1px solid var(--line); }
  .appr:last-child { border-bottom:0; }
  .appr .tile { width:52px; height:52px; border-radius:12px; background:var(--surface2); border:1px solid var(--line); display:grid; place-items:center; }
  .appr .tile img { width:36px; height:36px; object-fit:contain; }
  .appr h3 { margin:0; font-size:14.5px; font-weight:600; display:flex; justify-content:space-between; gap:10px; }
  .appr h3 small { font-weight:400; color:var(--dim); font-size:12.5px; white-space:nowrap; }
  .appr p { margin:3px 0 0; color:var(--fg2); font-size:13.5px; }
  .appr .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }

  .wip { display:grid; grid-template-columns:44px minmax(0,1fr) minmax(80px,160px) max-content 64px; gap:16px; align-items:center; padding:13px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .wip:last-child { border-bottom:0; }
  .wip:hover .tt { color:var(--accent); }
  .wip .ic { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); }
  .wip .tt { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wip .ss { color:var(--dim); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prog { height:6px; border-radius:999px; background:var(--idle-soft); overflow:hidden; }
  .prog i { display:block; height:100%; border-radius:inherit; background:var(--accent); transition:width .5s; }
  .prog.warn i { background:var(--warn); } .prog.over i { background:var(--bad); } .prog.ok i { background:var(--ok); }
  .prog.ind i { width:35%; animation:ind 1.6s ease-in-out infinite; }
  @keyframes ind { from { transform:translateX(-100%); } to { transform:translateX(290%); } }

  .spend .big { font-size:30px; font-weight:500; letter-spacing:-.02em; }
  .chart { position:relative; height:190px; margin-top:12px; }
  .chart svg { position:absolute; left:34px; right:0; top:6px; bottom:22px; width:calc(100% - 34px); height:calc(100% - 28px); overflow:visible; }
  .chart .y { position:absolute; left:0; font-size:11px; color:var(--dim); transform:translateY(-50%); }
  .chart .x { position:absolute; bottom:0; font-size:11px; color:var(--dim); transform:translateX(-50%); white-space:nowrap; }
  .chart .gl { position:absolute; left:34px; right:0; border-top:1px dashed var(--line); }
  .seg { display:inline-flex; border:1px solid var(--line2); border-radius:999px; padding:2px; }
  .seg button { border:0; background:none; padding:4px 12px; border-radius:999px; font-size:12.5px; color:var(--fg2); }
  .seg button[aria-pressed="true"] { background:var(--accent-soft); color:var(--accent); font-weight:500; }

  .empty { padding:28px 0; text-align:center; color:var(--dim); }
  .empty b { display:block; color:var(--fg); font-weight:600; margin-bottom:4px; }

  /* agents app */
  .agrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
  .acard { padding:20px; text-align:left; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; }
  .acard:hover { border-color:var(--line2); }
  .acard .h { display:flex; gap:14px; align-items:center; }
  .acard .h b { font-size:16px; display:block; }
  .acard .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding-top:12px; border-top:1px solid var(--line); }
  .acard .stats span { display:block; font:500 10px var(--mono); color:var(--dim); text-transform:uppercase; letter-spacing:.16em; }
  .acard .stats b { font-weight:600; font-size:14px; }
  .acard .doing { color:var(--fg2); font-size:13.5px; min-height:2.9em; }

  /* tasks app */
  .board { display:grid; grid-template-columns:repeat(5,minmax(230px,1fr)); gap:14px; overflow-x:auto; padding-bottom:8px; }
  .col { background:var(--surface2); border:1px solid var(--line); border-radius:var(--r); padding:12px; min-height:200px; }
  .col h3 { margin:2px 4px 12px; font-size:13px; display:flex; align-items:center; justify-content:space-between; color:var(--fg2); font-weight:600; }
  .tcard { width:100%; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:11px; padding:12px; margin-bottom:10px; display:grid; gap:8px; box-shadow:var(--shadow); }
  .tcard:hover { border-color:var(--accent); }
  .tcard .tt { font-weight:500; }
  .tcard .meta { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--dim); }
  .tcard .meta img { width:20px; height:20px; }
  .tcard .meta .sp { margin-left:auto; font-family:var(--mono); font-size:12px; }

  /* inbox and feed */
  .feed { display:grid; }
  .ev { display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); align-items:start; }
  .ev:last-child { border-bottom:0; }
  .ev .ic { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; background:var(--idle-soft); color:var(--fg2); }
  .ev .ic .i { width:16px; height:16px; }
  .ev .tx { font-size:13.5px; } .ev .tx .s { color:var(--dim); }
  .ev time { font-size:12px; color:var(--dim); white-space:nowrap; }

  /* wallet */
  .two { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-bottom:16px; align-items:start; }
  .three { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-bottom:16px; }
  .meter { height:10px; border-radius:999px; background:var(--idle-soft); overflow:hidden; margin:14px 0 8px; }
  .meter i { display:block; height:100%; background:var(--accent); border-radius:inherit; }
  .meter.warn i { background:var(--warn); } .meter.over i { background:var(--bad); }
  .kv { display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px 18px; font-size:13.5px; }
  .kv dt { color:var(--dim); } .kv dd { margin:0; min-width:0; }
  .acts { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .wal { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 0; border-bottom:1px solid var(--line); }
  .wal:last-child { border-bottom:0; }

  .notes { position:absolute; right:0; top:calc(100% + 8px); width:min(380px, calc(100vw - 32px)); background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-lg); padding:6px 16px 10px; z-index:30; }

  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:11px 16px; border-radius:11px; font-size:13.5px; z-index:60; box-shadow:var(--shadow-lg); animation:pop .15s; max-width:calc(100% - 32px); }

  /* sign in and first run */
  .gate { min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:linear-gradient(#01030a 0, rgba(1,3,10,.2) 45%, transparent 70%), url(/hero.jpg) center bottom / cover no-repeat #01030a; }
  .gate .panel { width:min(430px,100%); background:rgba(7,11,17,.72); -webkit-backdrop-filter:blur(14px) saturate(130%); backdrop-filter:blur(14px) saturate(130%); border:1px solid var(--line); border-radius:20px; padding:30px; box-shadow:var(--shadow-lg); }
  .gate .panel.wide { width:min(560px,100%); }

  /* small screens: the sidebar becomes a dock along the bottom */
  @media (max-width:1180px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } .grid-main { grid-template-columns:minmax(0,1fr); } }

    .top { gap:8px; } .search span, .search kbd { display:none; } .search { width:40px; padding:0; justify-content:center; }

  }

  @media (max-width:860px) { .show-s { display:block; } }

  @media (max-width:860px) { nav.apps button.dock-only { display:flex; } }

<body>

<div id="gate" class="gate" hidden></div>

<div id="shell" class="shell" hidden>
  <aside class="side"><div class="side-in">
    <div class="brand"><img src="/logo.png" alt="tab" width="50" height="22"><span>OS</span></div>
    <div class="switcher" id="switcher"></div>
    <nav class="apps" id="nav"></nav>
    <div class="spacer"></div>
    <div class="extra"><nav class="apps" id="nav2"></nav></div>
    <div style="position:relative" class="extra"><button class="me" id="me"></button></div>
  </div></aside>
  <div style="min-width:0">
    <header class="top">
      <div class="crumbs"><span class="ws">Workspace</span><span class="ws">/</span><button class="mswitch link" id="mswitch" style="color:var(--fg2)"></button><span class="mswitch" id="crumb-sep">/</span><b id="crumb"></b></div>
      <div class="grow"></div>
      <button class="search" id="search-btn" aria-label="Search or run a command"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search or run a command…</span><kbd id="kbd">⌘ K</kbd></button>
      <div style="position:relative"><button class="icon-btn" id="bell" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="dot" id="bell-dot" hidden></span></button><div id="notes" class="notes" hidden></div></div>
      <button class="btn primary newbtn" data-act="new-agent"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New agent</span></button>
    </header>
    <main class="app" id="main"></main>
  </div>
</div>

<div id="layer"></div>

<script>
(() => {
  // ---------------------------------------------------------------- helpers
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const num = (s) => Number(s) || 0;
  // cents, plus the sub-cent digits a micropayment needs: $1.50, $0.019, $0.0005
  const money = (v) => { const n = num(v); const a = Math.abs(n); return `${n < 0 ? '-' : ''}$${a.toFixed(6).replace(/0+$/, '').replace(/\.(\d?)$/, (m, d) => `.${d.padEnd(2, '0')}`)}`; };
  const ago = (iso) => {
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (!isFinite(s)) return '';
    if (s < 45) return 'just now'; if (s < 3600) return `${Math.round(s / 60)} min ago`; if (s < 86400) return `${Math.round(s / 3600)} h ago`;
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  };
  const clock = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  const today = (iso) => new Date(iso).toDateString() === new Date().toDateString();
  const hash = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
  const avatar = (a) => `/os-agent-${a && S.avIdx && S.avIdx.has(a.id) ? S.avIdx.get(a.id) % 8 : hash(a ? a.name : 'owner') % 8}.png?v=${AV}`;
  const I = {
    home: '<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    agents: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.6a3.2 3.2 0 0 1 0 6.3M18 14.3c1.8.8 3 2.6 3 4.7"/>',
    tasks: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
    inbox: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>',
    wallet: '<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M16 14.5h2"/>',
    receipts: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
    plug: '<circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M8 17 16 7M8.2 18H15.8"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    chevron: '<path d="m9 6 6 6-6 6"/>', down: '<path d="m6 9 6 6 6-6"/>', arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>', plus: '<path d="M12 5v14M5 12h14"/>',
    card: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h4"/>', alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/>', search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>', spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
    pause: '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>', play: '<path d="M7 5v14l12-7z"/>',
    building: '<rect x="4" y="3" width="11" height="18" rx="1.5"/><path d="M15 9h4.5a.5.5 0 0 1 .5.5V21H15M8 7h3M8 11h3M8 15h3"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/>', logout: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/>',
    download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>',
    bolt: '<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>', shield: '<path d="M12 3 4.5 6v6c0 4.5 3.2 7.8 7.5 9 4.3-1.2 7.5-4.5 7.5-9V6z"/><path d="m9 12 2 2 4-4"/>', globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
  };
  // the picture icons are Higgsfield renders (web/os-ic-*.png); small controls keep the stroke glyphs
  const AV = '__ASSET_V__'; // the server fills in a hash of the image files, so a changed icon is a new address
  const PIC = { home: 'home', agents: 'agents', tasks: 'tasks', check: 'tasks', inbox: 'inbox', wallet: 'wallet', receipts: 'receipts', plug: 'plug', settings: 'settings', card: 'card', alert: 'alert', doc: 'doc', search: 'search', key: 'key', building: 'building' };
  const ic = (n, cls = '') => PIC[n] ? `<span class="i pic ${cls}" style="--m:url(/os-ic-${PIC[n]}.png?v=${AV})" aria-hidden="true"></span>` : `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n] || ''}</svg>`;

  const APPS = [
    { id: 'overview', name: 'Overview', icon: 'home' },
    { id: 'agents', name: 'Agents', icon: 'agents' },
    { id: 'tasks', name: 'Tasks', icon: 'tasks' },
    { id: 'inbox', name: 'Inbox', icon: 'inbox' },
    { id: 'wallet', name: 'Wallet', icon: 'wallet' },
    { id: 'receipts', name: 'Receipts', icon: 'receipts' },
    { id: 'integrations', name: 'Integrations', icon: 'plug' },
  ];
  const ADAPTERS = { claude: 'Claude (on the company model key)', http: 'Your own endpoint (http)', starter: 'Starter (Wikipedia lookups, no model key)', 'claude-code': 'Claude Code (on this server)' };
  const S = { me: null, config: { adapters: ['claude', 'http'] }, companies: [], cid: ls.get('tab-os-company'), view: null, balances: null, earnings: null, templates: [], range: 30, filter: '', timer: null, fast: null, seen: null, overlay: null, install: null };

  async function api(path, body, method) {
    const r = await fetch(path, { method: method ?? (body === undefined ? 'GET' : 'POST'), credentials: 'same-origin', headers: body !== undefined ? { 'content-type': 'application/json' } : {}, body: body !== undefined ? JSON.stringify(body) : undefined });
    let out = {};
    try { out = await r.json(); } catch {}
    if (r.status === 401) { S.me = null; gate(); throw new Error(out.error || 'sign in first'); }
    if (!r.ok) throw new Error(out.error || `HTTP ${r.status}`);
    return out;
  }
  const C = () => `/api/companies/${encodeURIComponent(S.cid)}`;
  function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 3200); }
  async function busy(btn, fn, errEl) {
    if (btn) btn.disabled = true; if (errEl) errEl.textContent = '';
    try { await fn(); } catch (e) { if (errEl) errEl.textContent = e.message || String(e); else toast(e.message || String(e)); } finally { if (btn) btn.disabled = false; }
  }

  // ---------------------------------------------------------------- derived state
  function derive(v) {
    S.avIdx = new Map([...v.agents].sort((a, b) => (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0)).map((a, i) => [a.id, i]));
    const runningBy = new Map(v.runs.filter((r) => r.state === 'running').map((r) => [r.agent_id, r]));
    const pending = v.approvals.filter((a) => a.state === 'pending');
    const askBy = new Set(pending.map((a) => a.agent_id));
    const ticket = (id) => v.tickets.find((t) => t.id === id);
    const agents = v.agents.map((a) => {
      const run = runningBy.get(a.id);
      const open = v.tickets.filter((t) => t.assignee_id === a.id && (t.state === 'in_progress' || t.state === 'open')).sort((x, y) => (x.state === 'in_progress' ? -1 : 1) - (y.state === 'in_progress' ? -1 : 1))[0];
      const status = a.state === 'retired' ? 'retired' : askBy.has(a.id) ? 'approval' : run ? 'running' : 'idle';
      const task = run && run.ticket_id ? ticket(run.ticket_id)?.title : open ? open.title : null;
      const runs = v.runs.filter((r) => r.agent_id === a.id);
      const spentToday = runs.filter((r) => today(r.started_at)).reduce((n, r) => n + num(r.spent) + num(r.model_cost), 0);
      const spentAll = runs.reduce((n, r) => n + num(r.spent) + num(r.model_cost), 0);
      return { ...a, status, task, run, runs, spentToday, spentAll, img: avatar(a) };
    });
    const spentToday = v.runs.filter((r) => today(r.started_at)).reduce((n, r) => n + num(r.spent) + num(r.model_cost), 0);
    return { agents, pending, spentToday, byId: new Map(agents.map((a) => [a.id, a])), ticket };
  }
  const STATUS = { running: 'Running', approval: 'Needs approval', idle: 'Idle', retired: 'Retired' };
  const TSTATE = { open: 'Open', in_progress: 'In progress', review: 'Review', blocked: 'Blocked', done: 'Done', cancelled: 'Cancelled' };
  const st = (cls, label) => `<span class="st ${esc(cls)}">${esc(label)}</span>`;
  function apprTitle(a, who) {
    const name = who ? who.name : 'An agent';
    if (a.kind === 'budget' && a.payload.amount) return `${name} requests ${money(a.payload.amount)}`;
    if (a.kind === 'hire') return a.payload.name ? `${name} wants to hire ${a.payload.name}${a.payload.role ? `, ${a.payload.role}` : ''}` : `${name} wants to hire`;
    return `${name} asks: ${a.kind}`;
  }

  // ---------------------------------------------------------------- the gate: sign in, then the first company
  function gate(mode) {
    stopTimers();
    $('shell').hidden = true; $('gate').hidden = false;
    const g = $('gate');
    if (!S.me) {
      g.innerHTML = `<div class="panel"><div class="brand"><img src="/logo.png" alt="tab" width="50" height="22"><span>OS</span></div>
        <h1>Welcome to <em>tab OS.</em></h1><p class="lede" style="margin-bottom:8px">Run agents that spend real money, inside budgets you sign.</p>
        <label class="f" for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" placeholder="you@example.com">
        <label class="f" for="a-pass">Password</label><input id="a-pass" type="password" autocomplete="current-password" placeholder="At least 10 characters">
        <div class="row2"><button class="btn primary" id="a-login">Sign in</button><button class="btn" id="a-signup">Create account</button></div>
        <div class="err" id="a-err"></div></div>`;
      const go = (path) => busy($(path === 'login' ? 'a-login' : 'a-signup'), async () => {
        S.me = (await api(`/api/${path}`, { email: $('a-email').value.trim(), password: $('a-pass').value })).user;
        await start();
      }, $('a-err'));
      $('a-login').onclick = () => go('login'); $('a-signup').onclick = () => go('signup');
      $('a-pass').onkeydown = (e) => { if (e.key === 'Enter') go('login'); };
      $('a-email').focus();
      return;
    }
    // signed in with no company yet (or asked for a new one)
    const starter = (S.config.adapters || []).includes('starter');

  function spendChart(v, c) {
    const days = S.range; const end = new Date(); end.setHours(0, 0, 0, 0);

        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Daily spending"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
        <path d="${line} L${W} ${H} L0 ${H} Z" fill="url(#g)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
        ${xs.map((i, k) => `<span class="x" style="left:calc(34px + (100% - 34px) * ${i / (days - 1)});${k === 0 ? 'transform:none' : k === xs.length - 1 ? 'transform:translateX(-100%)' : ''}">${fmt(buckets[i].d)}</span>`).join('')}</div>`;

    overlay(`<aside class="drawer" role="dialog" aria-label="Task"><header><span class="ic" style="width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none">${ic('doc')}</span><div style="flex:1;min-width:0"><h2 class="wrap-any">${esc(t.title)}</h2><div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${st(t.state, TSTATE[t.state])}<span class="dim mono">#${esc(t.id)}</span></div></div><button class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></header>
      <div class="scroll"><dl class="kv"><dt>Assigned to</dt><dd>${a ? `<span class="who" style="font-weight:500"><img class="av" style="width:22px;height:22px" src="${a.img}" alt="">${esc(a.name)}</span>` : 'Nobody'}</dd><dt>Spent</dt><dd class="mono">${money(t.spent)}${t.budget ? ` of ${money(t.budget)}` : ''}</dd><dt>Opened by</dt><dd>${esc(t.created_by_name)} · ${ago(t.created_at)}</dd>${t.parent_id ? `<dt>Part of</dt><dd class="mono">#${esc(t.parent_id)}</dd>` : ''}</dl>
        ${t.body ? `<div class="sec"><h3>Details</h3><div style="white-space:pre-wrap" class="wrap-any">${esc(t.body)}</div></div>` : ''}
        ${t.evidence.length ? `<div class="sec"><h3>Evidence</h3>${t.evidence.map((e) => `<div class="msg"><div class="w">${esc(e.kind)}${e.run_id ? ` · run ${esc(e.run_id)}` : ''}</div><div class="wrap-any">${/^https:\/\//.test(e.value) ? `<a href="${esc(e.value)}" target="_blank" rel="noopener">${esc(e.value)}</a>` : esc(e.value)}</div></div>`).join('')}</div>` : ''}
        <div class="sec"><h3>Thread</h3><div id="td-thread"><p class="dim">Loading…</p></div></div>
        <div class="sec"><h3>Reply or update</h3><textarea id="td-comment" placeholder="Comment. Mention an agent by name to wake it."></textarea>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label class="f" for="td-state">Move to</label><select id="td-state"><option value="">Keep ${esc(TSTATE[t.state])}</option>${Object.entries(TSTATE).filter(([k]) => k !== t.state).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
          <div><label class="f" for="td-as">Assign to</label><select id="td-as"><option value="">Keep</option>${active.map((x) => `<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('')}</select></div></div>
          <input id="td-reason" style="margin-top:10px" placeholder="Reason (needed to close without evidence)">
          <div class="acts"><button class="btn primary" id="td-go">Save</button></div><div class="err" id="td-err"></div></div></div></aside>`, 'drawer');
    $('td-go').onclick = () => busy($('td-go'), async () => {
      const text = $('td-comment').value.trim();
      if (text) await api(`${C()}/tickets/${id}/comment`, { text });
      const patch = {}; if (val('td-state')) patch.state = val('td-state'); if (val('td-as')) patch.assignee = val('td-as'); if (val('td-reason')) patch.reason = val('td-reason');
      if (Object.keys(patch).length) await api(`${C()}/tickets/${id}`, patch);
      await refresh(); ticketDrawer(id); toast('Saved');
    }, $('td-err'));
    try {
      const th = await api(`${C()}/tickets/${id}`);
      const el = $('td-thread'); if (!el) return;
      el.innerHTML = th.thread.map((e) => {
        const who = e.agent_id ? (d.byId.get(e.agent_id)?.name || 'agent') : 'You';
        if (e.kind === 'comment') return `<div class="msg"><div class="w">${esc(who)} · ${ago(e.at)}</div><div style="white-space:pre-wrap" class="wrap-any">${esc(e.body.text)}</div></div>`;
        if (e.kind === 'run') return `<div class="msg"><div class="w">${esc(who)} · run ${esc(e.body.status || '')} · ${ago(e.at)}</div><div style="white-space:pre-wrap" class="wrap-any">${esc(e.body.summary || '')}</div>${e.body.spent ? `<div class="dim mono" style="margin-top:6px">${esc(e.body.spent)}</div>` : ''}</div>`;
        return `<div class="msg sys"><div class="w">${esc(who)} · ${esc(e.kind)} · ${ago(e.at)}</div>${evText(e, d)}</div>`;
      }).join('') || '<p class="dim">No activity yet.</p>';
    } catch (e) { const el = $('td-thread'); if (el) el.innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
  }

  function agentDrawer(id) {
    const a = S.d.byId.get(id); if (!a) return;
    const v = S.view; const tickets = v.tickets.filter((t) => t.assignee_id === id && !['done', 'cancelled'].includes(t.state));
    overlay(`<aside class="drawer" role="dialog" aria-label="Agent"><header><img class="av lg" src="${a.img}" alt=""><div style="flex:1;min-width:0"><h2>${esc(a.name)}</h2><div class="fg2">${esc(a.role || '')}</div><div style="margin-top:8px">${st(a.status, STATUS[a.status])}</div></div><button class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></header>
      <div class="scroll"><dl class="kv"><dt>Runs on</dt><dd>${esc(ADAPTERS[a.adapter] || a.adapter)}${a.adapter === 'claude' ? ` <span class="dim mono" style="font-size:12px">${esc((a.config && a.config.model) || 'claude-sonnet-5-5')}</span>` : ''}</dd><dt>Per run</dt><dd class="mono">${money(a.budget_per_run)}</dd><dt>Heartbeat</dt><dd>${a.heartbeat_s ? `every ${esc(a.heartbeat_s)} s` : 'wakes when assigned or mentioned'}</dd><dt>Spent today</dt><dd class="mono">${money(a.spentToday)}</dd><dt>Last run</dt><dd>${a.last_run_at ? ago(a.last_run_at) : 'never'}</dd><dt>Key</dt><dd class="mono wrap-any" style="font-size:11.5px">${esc(a.agent_pub)}</dd></dl>
        ${a.state === 'active' ? `<div class="acts"><button class="btn primary" data-act="new-task" data-for="${esc(a.name)}">${ic('plus')} Give a task</button><button class="btn" data-act="agent-settings" data-for="${esc(a.id)}">${ic('settings')} Settings</button><button class="btn danger" data-retire="${esc(a.id)}">Retire</button></div>` : ''}
        ${a.instructions ? `<div class="sec"><h3>Instructions</h3><div style="white-space:pre-wrap" class="fg2 wrap-any">${esc(a.instructions)}</div></div>` : ''}
        <div class="sec"><h3>Open tasks</h3>${tickets.length ? tickets.map((t) => `<div class="msg" data-ticket="${esc(t.id)}" style="cursor:pointer;display:flex;justify-content:space-between;gap:10px"><span>${esc(t.title)}</span>${st(t.state, TSTATE[t.state])}</div>`).join('') : '<p class="dim">None.</p>'}</div>
        <div class="sec"><h3>Recent runs</h3>${a.runs.length ? `<table class="t"><tr><th>When</th><th>Why</th><th>State</th><th style="text-align:right">Cost</th></tr>${a.runs.slice(0, 12).map((r) => `<tr class="click" data-run="${esc(r.id)}"><td class="dim">${ago(r.started_at)}</td><td class="fg2">${esc(r.reason)}</td><td>${st(r.state === 'done' && r.result ? (r.result.status || 'done') : r.state, r.state === 'done' && r.result ? (r.result.status || 'done') : r.state)}</td><td class="mono" style="text-align:right">${money(num(r.spent) + num(r.model_cost))}</td></tr>`).join('')}</table><pre class="pre" id="ad-run" hidden></pre>` : '<p class="dim">No runs yet.</p>'}</div></div></aside>`, 'drawer');
  }
  async function showRun(id) {
    const el = $('ad-run'); if (!el) return;
    el.hidden = false; el.textContent = 'Loading…';
    try {
      const r = (await api(`${C()}/runs/${id}`)).run;
      el.textContent = `run ${r.id}: ${r.state}${r.error ? `\nerror: ${r.error}` : ''}\nspent ${r.spent} through tab, ${r.model_cost} model${r.mandate ? `\nmandate ${r.mandate.id} at ${(r.mandate.allow || []).join(', ')}` : ''}\n\n${r.result ? JSON.stringify(r.result, null, 2) + '\n\n' : ''}${r.output || ''}`;
    } catch (e) { el.textContent = e.message; }
  }

  // the command palette: every app, every agent, every open task, and the common actions
  function commands() {
    const v = S.view; const d = S.d; const out = [];
    for (const a of [...APPS, { id: 'settings', name: 'Settings', icon: 'settings' }]) out.push({ label: `Open ${a.name}`, icon: a.icon, hint: 'App', run: () => go(a.id) });
    out.push({ label: 'New agent', icon: 'plus', hint: 'Action', run: hireModal });
    out.push({ label: 'New task', icon: 'plus', hint: 'Action', run: () => taskModal() });
    out.push({ label: v.company.state === 'paused' ? 'Resume company' : 'Pause company', icon: v.company.state === 'paused' ? 'play' : 'pause', hint: 'Action', run: togglePause });
    out.push({ label: 'Change budget', icon: 'wallet', hint: 'Action', run: budgetModal });
    out.push({ label: 'Add Anthropic key', icon: 'key', hint: 'Action', run: keyModal });
    out.push({ label: 'Toggle dark mode', icon: 'moon', hint: 'Action', run: () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light') });
    for (const a of d.pending) { const who = d.byId.get(a.agent_id); out.push({ label: `Approve: ${apprTitle(a, who)}`, icon: 'check', hint: 'Approval', run: () => decide(a.id, 'approve') }); }
    for (const a of d.agents.filter((x) => x.state === 'active')) out.push({ label: a.name, img: a.img, hint: a.role || 'Agent', run: () => agentDrawer(a.id) });
    for (const t of v.tickets.filter((x) => !['done', 'cancelled'].includes(x.state)).slice(0, 60)) out.push({ label: t.title, icon: 'doc', hint: `#${t.id}`, run: () => ticketDrawer(t.id) });
    for (const c of S.companies.filter((x) => x.id !== S.cid)) out.push({ label: `Switch to ${c.name}`, icon: 'building', hint: 'Company', run: () => switchTo(c.id) });
    return out;
  }
  function palette() {
    overlay(`<div class="palette" role="dialog" aria-label="Command palette"><input id="pal-q" placeholder="Search agents, tasks and actions" autocomplete="off"><ul id="pal-list" role="listbox"></ul></div>`, 'palette');
    const all = commands(); let sel = 0; let shown = all;
    const draw = () => {
      const q = $('pal-q').value.trim().toLowerCase();
      shown = (q ? all.filter((c) => c.label.toLowerCase().includes(q) || String(c.hint).toLowerCase().includes(q)) : all).slice(0, 40);
      sel = Math.min(sel, Math.max(0, shown.length - 1));
      $('pal-list').innerHTML = shown.map((c, i) => `<li role="option" data-i="${i}" aria-selected="${i === sel}">${c.img ? `<img src="${c.img}" alt="">` : ic(c.icon)}<span>${esc(c.label)}</span><small>${esc(c.hint)}</small></li>`).join('') || '<li class="dim">Nothing matches.</li>';
    };
    const run = (i) => { const c = shown[i]; if (!c) return; closeOverlay(); c.run(); };
    $('pal-q').oninput = () => { sel = 0; draw(); };
    $('pal-q').onkeydown = (e) => {
      if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, shown.length - 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
      else if (e.key === 'Enter') { run(sel); e.preventDefault(); }
    };
    $('pal-list').onclick = (e) => { const li = e.target.closest('li[data-i]'); if (li) run(Number(li.dataset.i)); };
    draw();
  }

  function renderNotes() {
    const v = S.view; const d = S.d;
    const loud = v.events.filter((e) => ['request', 'budget-warning', 'paused', 'run', 'needs-model-key', 'late-spend'].includes(e.kind)).slice(0, 8);
    $('notes').innerHTML = `<h3>Needs approval <span class="dim" style="font-weight:400">${d.pending.length}</span></h3>${d.pending.length ? d.pending.slice(0, 4).map((a) => apprCard(a, d, true)).join('') : '<p class="dim" style="margin:4px 0 8px">Nothing waiting on you.</p>'}
      <h3>Recent</h3><div class="feed">${loud.map((e) => evLine(e, d)).join('') || '<p class="dim">Quiet so far.</p>'}</div>`;
  }
  // a desktop notification for each new request, once notifications are on
  function notifyNew() {
    const ids = new Set(S.d.pending.map((a) => a.id));
    if (S.seen && 'Notification' in window && Notification.permission === 'granted') {
      for (const a of S.d.pending) if (!S.seen.has(a.id)) {
        try { const n = new Notification(apprTitle(a, S.d.byId.get(a.agent_id)), { body: a.payload.reason || 'Open tab OS to decide.', icon: '/os-icon-192.png', tag: `tab-${a.id}` }); n.onclick = () => { window.focus(); go('inbox'); }; } catch {}
      }
    }
    S.seen = ids;
  }

  // ---------------------------------------------------------------- actions
  function go(app) { closeOverlay(); $('notes').hidden = true; location.hash = `#/${app}`; }
  async function decide(id, decision) { const r = await api(`${C()}/approvals/${id}`, { decision }); toast(r && r.agent ? `${r.agent.name} is hired` : decision === 'approve' ? 'Approved' : 'Rejected'); await refresh(); }
  async function togglePause() { const paused = S.view.company.state === 'paused'; await api(`${C()}/${paused ? 'resume' : 'pause'}`, {}); toast(paused ? 'Company resumed' : 'Company paused'); await refresh(); }
  const MODELS = [['claude-sonnet-5-5', 'Sonnet 5.5 (default)'], ['claude-haiku-5-5', 'Haiku 5.5, fastest and cheapest'], ['claude-opus-5-5', 'Opus 5.5, most capable']];
  function agentSettingsModal(el) {
    const a = S.d.byId.get(el.dataset.for); if (!a) return;
    const cur = (a.config && a.config.model) || 'claude-sonnet-5-5';
    modal(`${a.name}'s settings`, 'What this agent thinks with and what it may spend. This is a signed board action.', `${a.adapter === 'claude' ? `<label class="f" for="as-model">Model</label><select id="as-model">${MODELS.map(([id, n]) => `<option value="${id}"${id === cur ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label class="f" for="as-budget">Per run</label><input id="as-budget" value="${esc(a.budget_per_run)}" inputmode="decimal"></div><div><label class="f" for="as-max">Per call</label><input id="as-max" value="${esc((a.config && a.config.max_per_call) || '')}" placeholder="no cap" inputmode="decimal"></div></div>
      <label class="f" for="as-instr">Instructions</label><textarea id="as-instr">${esc(a.instructions || '')}</textarea>`, 'Save', async () => {
      const body = { budget_per_run: val('as-budget'), max_per_call: val('as-max'), instructions: $('as-instr').value };
      if ($('as-model')) body.model = val('as-model');
      await api(`${C()}/agents/${a.id}/configure`, body);
      toast(`${a.name} updated`);
    });
  }
  function charterModal() { const c = S.view.company; modal('Name and mission', 'What every agent reads first. This is a signed board action.', `<label class="f" for="ch-name">Name</label><input id="ch-name" maxlength="80" value="${esc(c.name)}" autofocus><label class="f" for="ch-mission">Mission</label><textarea id="ch-mission">${esc(c.mission)}</textarea>`, 'Save', async () => { await api(`${C()}/charter`, { name: val('ch-name'), mission: val('ch-mission') }); toast('Company updated'); }); }
  function budgetModal() { modal('Change budget', 'The most the whole company can ever spend, models included. This is a signed board action.', `<label class="f" for="b-val">Budget</label><input id="b-val" value="${esc(S.view.company.budget)}" inputmode="decimal" autofocus>`, 'Save budget', async () => { await api(`${C()}/budget`, { budget: val('b-val') }); toast('Budget updated'); }); }
  function keyModal() { modal('Anthropic API key', 'Claude agents run on the company\'s own key. It is checked with Anthropic, sealed at rest, and never shown again.', `<label class="f" for="k-val">Key</label><input id="k-val" type="password" class="mono" placeholder="sk-ant-…" autocomplete="off" autofocus>`, 'Save key', async () => { await api(`${C()}/model-key`, { key: val('k-val') }); toast('Model key saved'); }); }
  function publishModal() { modal('Publish your company', 'Sell your company\'s work through a tab gateway. Other agents pay per call and get signed receipts.', `<label class="f" for="p-gw">Gateway</label><input id="p-gw" placeholder="https://pay.paidwithtab.com" value="${esc(S.earnings?.gateway || '')}" autofocus>`, 'Publish', async () => { await api(`${C()}/publish`, { gateway: val('p-gw') }); toast('Published'); loadMoney(); }); }
  async function switchTo(id) { closeOverlay(); S.cid = id; ls.set('tab-os-company', id); $('main').dataset.h = ''; await start(); }
  function switchMenu(anchor) {
    const existing = anchor.querySelector('.menu'); if (existing) { existing.remove(); return; }
    const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
    m.innerHTML = S.companies.map((c) => `<button data-switch="${esc(c.id)}">${ic('building')}<span style="flex:1">${esc(c.name)}</span>${c.id === S.cid ? ic('check') : ''}</button>`).join('') + `<hr><button data-act="new-company">${ic('plus')} New company</button>`;
    anchor.append(m);
  }
  function meMenu() {
    const host = $('me').parentElement; const existing = host.querySelector('.menu'); if (existing) { existing.remove(); return; }
    const m = document.createElement('div'); m.className = 'menu'; m.style.top = 'auto'; m.style.bottom = 'calc(100% + 6px)';
    m.innerHTML = `<button data-go="settings">${ic('settings')} Settings</button><button data-act="theme-toggle">${ic('moon')} Toggle dark mode</button><hr><button data-act="logout">${ic('logout')} Sign out</button>`;
    host.append(m);
  }
  // dark like the home page unless someone picks light; an old 'auto' reads as dark
  function applyTheme() { if (ls.get('tab-os-theme') === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme; }
  function setTheme(t) { ls.set('tab-os-theme', t); applyTheme(); $('main').dataset.h = ''; render(); }
  async function exportKey() {
    if (!confirm('Export the owner key? It signs board actions and moves company funds. The export is logged.')) return;
    const k = await api(`${C()}/key`);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ publicKey: k.publicKey, privateKey: k.privateKey }, null, 2) + '\n'], { type: 'application/json' })); a.download = `owner-${S.cid}.json`; a.click();
  }

  const ACTS = {
    'new-agent': hireModal, 'new-task': (el) => taskModal(el.dataset.for), close: closeOverlay, pause: togglePause, budget: budgetModal, charter: charterModal, 'agent-settings': agentSettingsModal,
    'model-key': keyModal, 'model-key-rm': async () => { if (confirm('Remove the company model key? Claude agents stop until a new one is set.')) { await api(`${C()}/model-key`, { remove: true }); await refresh(); } },
    publish: publishModal, fund: async () => { const r = await api(`${C()}/fund`, {}); toast(r.results.map((x) => x.credited ? `Credited ${x.credited}` : x.already_claimed ? 'Already claimed' : x.error || 'No faucet here').join('; ')); loadMoney(); },
    'reload-money': () => { S.balances = null; S.chain = null; render(); loadMoney(); }, 'chain-auth': chainAuthModal, 'export-key': exportKey, logout, 'new-company': () => { closeOverlay(); gate('new'); },
    switch: (el) => switchMenu(el.parentElement), 'theme-toggle': () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'),
    'fr-again': async (el) => { const topic = val('fr-topic'); if (!topic) return; await api(`${C()}/tickets`, { title: `Look up: ${topic}`, assignee: el.dataset.for, budget: '0.01' }); $('fr-topic').value = ''; await refresh(); },
    'hide-fr': () => { ls.set(`tab-os-fr-${S.cid}`, 'hidden'); render(); },
    install: async () => { if (!S.install) return; S.install.prompt(); try { await S.install.userChoice; } catch {} S.install = null; render(); },
    more: () => overlay(`<div class="palette" role="dialog" aria-label="More" style="top:auto;bottom:90px"><ul>${[['receipts', 'Receipts', 'receipts'], ['integrations', 'Integrations', 'plug'], ['settings', 'Settings', 'settings']].map(([id, n, i]) => `<li data-go="${id}">${ic(i)}<span>${n}</span></li>`).join('')}<li data-act="new-company">${ic('plus')}<span>New company</span></li><li data-act="logout">${ic('logout')}<span>Sign out</span></li></ul></div>`, 'menu'),
    notify: async () => { try { await Notification.requestPermission(); } catch {} $('main').dataset.h = ''; render(); },
  };
  // one delegated click handler for the whole OS
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act],[data-go],[data-agent],[data-ticket],[data-approve],[data-reject],[data-review],[data-retire],[data-run],[data-range],[data-theme],[data-switch]');
    document.querySelectorAll('.menu').forEach((m) => { if (!m.parentElement.contains(e.target)) m.remove(); });
    if (!$('notes').hidden && !e.target.closest('#notes, #bell')) $('notes').hidden = true;
    if (!t) return;
    const ds = t.dataset;
    if (ds.act) { const f = ACTS[ds.act]; if (f) busy(t.tagName === 'BUTTON' ? t : null, () => f(t)); return; }
    if (ds.go) { go(ds.go); return; }
    if (ds.approve) { busy(t, () => decide(ds.approve, 'approve')); return; }
    if (ds.reject) { busy(t, () => decide(ds.reject, 'reject')); return; }
    if (ds.review) { go('inbox'); return; }
    if (ds.retire) { if (confirm('Retire this agent? It stops taking work; its history stays.')) busy(t, async () => { await api(`${C()}/agents/${ds.retire}/retire`, {}); closeOverlay(); toast('Agent retired'); await refresh(); }); return; }
    if (ds.run) { showRun(ds.run); return; }
    if (ds.range) { S.range = Number(ds.range); $('main').dataset.h = ''; render(); return; }
    if (ds.theme) { setTheme(ds.theme); return; }
    if (ds.switch) { switchTo(ds.switch); return; }
    if (ds.agent) { agentDrawer(ds.agent); return; }
    if (ds.ticket) { $('notes').hidden = true; ticketDrawer(ds.ticket); return; }
  });
  function bindMain(app) {
    if (app === 'receipts') { const f = $('rc-filter'); if (f) f.oninput = () => { S.filter = f.value; const pos = f.selectionStart; f.blur(); $('main').dataset.h = ''; render(); const g = $('rc-filter'); g.focus(); g.setSelectionRange(pos, pos); }; }
  }
  $('search-btn').onclick = palette;
  $('bell').onclick = () => { $('notes').hidden = !$('notes').hidden; if (!$('notes').hidden) renderNotes(); };
  $('me').onclick = (e) => { e.stopPropagation(); meMenu(); };
  $('mswitch').onclick = (e) => { e.stopPropagation(); switchMenu($('mswitch').parentElement); };
  $('mswitch').parentElement.style.position = 'relative';
  if (!/Mac|iPhone|iPad/.test(navigator.platform)) $('kbd').textContent = 'Ctrl K';
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (S.view) { S.overlay === 'palette' ? closeOverlay() : palette(); } return; }
    if (e.key === 'Escape') { if (S.overlay) closeOverlay(); $('notes').hidden = true; document.querySelectorAll('.menu').forEach((m) => m.remove()); }
    if (!S.overlay && S.view && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '') && !e.metaKey && !e.ctrlKey && !e.altKey) {
      const n = Number(e.key); if (n >= 1 && n <= APPS.length) go(APPS[n - 1].id);
    }
  });
  window.addEventListener('hashchange', () => { closeOverlay(); render(); window.scrollTo(0, 0); });
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.install = e; if (S.view) { $('main').dataset.h = ''; render(); } });
  if ('serviceWorker' in navigator) {
    // when a new worker takes over (a deploy changed the shell), reload once so the page and its images match
    const had = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('/os-sw.js', { scope: '/' }).catch(() => {});
  }

  boot();
})();
</script>
